# AkreTrix security test targets
#
# Read by bin/run-all.sh. One target per line:
#
#   repo <path>                     static review of a local checkout
#   site <url>                      runtime review of a deployed HTML site
#   api  <url> [expected-origin]    security probe of an HTTP API endpoint
#
# Blank lines and # comments are ignored. Paths are relative to this file.
#
# Only list properties your organisation controls — site and api targets make
# real requests.

# ---------------------------------------------------------------- repositories
repo ../akretrix-landing-page
repo ../akretrix-iac
repo ../monitoringsentinel

# ----------------------------------------------------------------------- sites
site https://akretrix.com

# ------------------------------------------------------------------------ APIs
# The expected origin is asserted against Access-Control-Allow-Origin.
#
# NOTE on the trailing slash: these paths are route-sensitive. Adding one makes
# api.akretrix.com/free-tools/ return 404, so write them exactly as routed.
api https://api.akretrix.com/free-tools https://akretrix.com
api https://api.akretrix.com/contact    https://akretrix.com
